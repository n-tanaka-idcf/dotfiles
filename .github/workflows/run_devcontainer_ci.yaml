---
name: run_devcontainer_ci

on:
  pull_request:
    paths:
      - .github/workflows/run_devcontainer_ci.yaml
      - .devcontainer/**
      - .chezmoiroot
      - home/**
      - install.sh
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      matrix:
        include:
          - devcontainer: ubuntu
      fail-fast: false

    name: Build devcontainer for ${{ matrix.devcontainer }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show workflow run-time information
        run: |
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Branch: ${GITHUB_REF}"
          echo "Ref name: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Create .env file
        run: |
          cp .devcontainer/.env.example .devcontainer/.env

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/${{ matrix.devcontainer }}/devcontainer.json
          push: never
          runCmd: |
            chezmoi --version
            mise --version
            echo "${{ matrix.devcontainer }} has been built successfully"
