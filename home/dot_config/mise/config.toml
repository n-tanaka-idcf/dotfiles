[tools]
# aqua の atuin は glibc 版で、RHEL 9（glibc 2.34）では動かないため musl 版を使う
"github:atuinsh/atuin" = { version = "latest", platforms = { linux-x64 = { asset_pattern = "atuin-x86_64-unknown-linux-musl.tar.gz" }, linux-arm64 = { asset_pattern = "atuin-aarch64-unknown-linux-musl.tar.gz" } } }
carapace = "latest"
claude = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
herdr = "latest"
jq = "latest"
k9s = "latest"
kind = "latest"
kubectl = "latest"
lefthook = "latest"
neovim = "latest"
nushell = "latest"
ripgrep = "latest"
shellcheck = "latest"
starship = "latest"
task = "latest"
"github:Gaurav-Gosain/tuios" = "latest"
zoxide = "latest"

[env]
# Claude Code は mise で更新するため、自動更新を無効にする
DISABLE_AUTOUPDATER = "1"
