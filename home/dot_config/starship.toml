"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:seg_user)\
$os\
$username\
[](bg:seg_dir fg:seg_user)\
$directory\
[](fg:seg_dir bg:seg_git)\
$git_branch\
$git_status\
[](fg:seg_git bg:seg_lang)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:seg_lang bg:seg_docker)\
$docker_context\
[ ](fg:seg_docker)\
$cmd_duration\
$line_break\
$character\
"""

palette = "custom"

[palettes.custom]
# Text color of the colored segments
segment_fg = "#000000"

# Background colors of the segments (neon)
seg_user = "#FF2BD6"
seg_dir = "#FF9F1C"
seg_git = "#E4FF1A"
seg_lang = "#39FF14"
seg_docker = "#00F5FF"

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:seg_user fg:segment_fg"
style_root = "bg:seg_user fg:segment_fg"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:seg_user fg:segment_fg"
disabled = true # Disabled by default

[directory]
style = "bg:seg_dir fg:segment_fg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:seg_docker fg:segment_fg"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:seg_git fg:segment_fg"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:seg_git fg:#B00020 bold"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:seg_lang fg:segment_fg"
format = '[ $symbol ($version) ]($style)'

[cmd_duration]
min_time = 2000
format = '[ took $duration ]($style)'
style = "yellow"

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
